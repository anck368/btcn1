<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>fish tank</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #content {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #4facfe 0%, #00f2fe 35%, #0250c5 100%);
    }
    .creature {
      position: absolute;
    }
    #shark {
      left: -250px;
      top: 150px;
      width: 220px;
      animation: swimRight 14s linear infinite;
    }
    #turtle {
      left: -200px;
      top: 420px;
      width: 160px;
      animation: swimRight 22s linear infinite;
      animation-delay: 2s;
    }
    #goldFishSchool {
      left: -180px;
      top: 280px;
      width: 140px;
      animation: swimWave 16s ease-in-out infinite;
    }
    #diver1 {
      left: -180px;
      top: 80px;
      width: 150px;
      animation: swimWave 18s linear infinite;
    }

    #diver2 {
      left: -180px;
      top: 320px;
      width: 140px;
      animation: swimRight 20s linear infinite;
      animation-delay: 5s;
    }

    #diver3 {
      left: -180px;
      top: 500px;
      width: 130px;
      animation: swimWave 17s linear infinite;
      animation-delay: 9s;
    }
    .bubble {
      position: absolute;
      bottom: -1000px;
      width: 600px;
      opacity: 0.75;
      animation: riseUp 10s linear infinite;
    }

    .b1 { left: 20%; animation-duration: 9s; }
    .b2 { left: 55%; animation-duration: 12s; animation-delay: 3s; }
    .b3 { left: 80%; animation-duration: 8s; animation-delay: 6s; }

    @keyframes swimRight {
      0% {
        left: -260px;
      }
      100% {
        left: 105vw;
      }
    }
    @keyframes swimWave {
      0% {
        left: -220px;
        transform: translateY(0px);
      }
      25% {
        transform: translateY(-25px);
      }
      50% {
        transform: translateY(15px);
      }
      75% {
        transform: translateY(-20px);
      }
      100% {
        left: 105vw;
        transform: translateY(0px);
      }
    }
    @keyframes riseUp {
      0% {
        bottom: -100px;
        transform: translateX(0);
      }
      50% {
        transform: translateX(20px);
      }
      100% {
        bottom: 105vh;
        transform: translateX(-15px);
      }
    }
  </style>
</head>
<body>
  <div id="content">
    <img src="faintSchool.png" class="bubble b1" alt="bubble" />
    <img src="faintSchool.png" class="bubble b2" alt="bubble" />
    <img id="shark" class="creature" src="shark.png" alt="shark" />
    <img id="turtle" class="creature" src="turtle.png" alt="turtle" />
    <img id="goldFishSchool" class="creature" src="goldFishSchool.png" alt="goldfish" />
    <img id="diver1" class="creature" src="diver1.png" alt="diver1" />
    <img id="diver2" class="creature" src="diver2.png" alt="diver2" />
    <img id="diver3" class="creature" src="diver3.png" alt="diver3" />
    <img src="faintSchool.png" class="bubble b3" alt="bubble" />
  </div>
</body>
</html>
